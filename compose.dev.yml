# docker compose -f compose.dev.yml up

services:
  nzip-server:
    container_name: nzip-server
    image: nzip:dev
    # command: ['start.sh', '4'] # Uncomment to run in cluster mode
    build: .
    ports:
      - '3000:3000'
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
      - API_URL=${API_URL}
      - IMAGE_URL=${IMAGE_URL}
      - CONCURRENT_IMAGE_DOWNLOADS=${CONCURRENT_IMAGE_DOWNLOADS}
      - RATE_LIMIT=${RATE_LIMIT:-10}
      - SEARCH_RATE_LIMIT=${SEARCH_RATE_LIMIT:-20}
      - SEARCH_HOURLY_LIMIT=${SEARCH_HOURLY_LIMIT:-300}
      - TRUST_X_FORWARDED_FOR=${TRUST_X_FORWARDED_FOR:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - LOG_CLIENT_IP=${LOG_CLIENT_IP:-false}
      - LOG_CLIENT_SALT=${LOG_CLIENT_SALT:-}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - ANALYTICS=${ANALYTICS}
      - CONTENT_SECURITY_POLICY=${CONTENT_SECURITY_POLICY:-}
      - NODE_ENV=${NODE_ENV}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PREFIX=${S3_PREFIX:-}
      - S3_VIRTUAL_HOSTED_STYLE=${S3_VIRTUAL_HOSTED_STYLE:-false}
      - S3_PART_SIZE_MB=${S3_PART_SIZE_MB:-64}
      - S3_UPLOAD_CONCURRENCY=${S3_UPLOAD_CONCURRENCY:-3}
      - ARCHIVE_RETENTION_DAYS=${ARCHIVE_RETENTION_DAYS:-7}
      - ARCHIVE_MAX_GB=${ARCHIVE_MAX_GB:-0}
      - DRAIN_TIMEOUT_SECONDS=${DRAIN_TIMEOUT_SECONDS:-60}
    volumes:
      - nzip-cache:/workspace/Cache
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  nzip-cache:
