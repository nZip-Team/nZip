name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Same Bun as the Docker image (oven/bun:1.4-alpine)
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: Core/go.sum

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Test server
        run: bun test

      - name: Test core
        working-directory: Core
        run: go test ./...

      - name: Build core
        run: bun run build:core

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    # Only this job may dispatch the Release workflow
    permissions:
      contents: write

    steps:
      - name: Trigger Release workflow
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'run-release',
              client_payload: {
                sha: context.sha,
                ref: context.ref,
                message: context.payload.head_commit?.message || ''
              }
            })
