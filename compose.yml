services:
  nzip-server:
    container_name: nzip-server
    image: ghcr.io/nzip-team/nzip:latest
    # command: ['start.sh', '4'] # Uncomment to run in cluster mode
    ports:
      - '3000:3000'
    # Every variable in .env is passed through
    env_file:
      - .env
    volumes:
      - nzip-cache:/workspace/Cache
    # Longer than DRAIN_TIMEOUT_SECONDS
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  nzip-cache:
